# .github/workflows/docker-build.yml
name: CI / CD – Build & Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build_and_push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/colornode
      LATEST_TAG: latest
      SHA_TAG: sha-${{ github.sha }}
      BRANCH_TAG: branch-${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE_NAME }}:${{ env.BRANCH_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Show image info
        run: |
          echo "Image ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }} pushed."
          echo "   – SHA tag: ${{ env.SHA_TAG }}"
          echo "   – Branch tag: ${{ env.BRANCH_TAG }}"
